<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Brauser</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header>
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="newtab" title="Новая вкладка (Ctrl+T)">+</button>
    </div>
    <div id="nav">
      <button id="back" title="Назад">←</button>
      <button id="forward" title="Вперёд">→</button>
      <button id="reload" title="Обновить (Ctrl+R)">⟳</button>
      <form id="addrform"><input id="addr" type="text" spellcheck="false" autocomplete="off" placeholder="Адрес или поисковый запрос"></form>
      <span id="chip" title="Текущий маршрут"></span>
      <button id="rotate" class="wide" title="Сменить маршрут, вкладки остаются (Ctrl+Shift+I)">Сменить IP</button>
      <button id="ident" class="wide accent" title="Новый IP, новый отпечаток, куки и вкладки стираются (Ctrl+Shift+N)">Новая личность</button>
      <button id="gear" title="Настройки">⚙</button>
    </div>
  </header>

  <main id="panel" hidden>
    <div class="cols">
      <section>
        <h2>Сеть</h2>
        <label class="radio"><input type="radio" name="mode" value="direct"> Напрямую <small>реальный IP, только подмена отпечатка</small></label>
        <label class="radio"><input type="radio" name="mode" value="tor"> Tor <small>встроенный, новая цепочка по кнопке</small></label>
        <label class="radio"><input type="radio" name="mode" value="proxy"> Свои прокси <small>ротация по списку</small></label>

        <h3>Tor</h3>
        <p id="torstatus" class="status"></p>
        <label>Путь к tor.exe <small>пусто — искать в папке tor/ рядом с проектом</small>
          <input id="torpath" type="text" spellcheck="false">
        </label>
        <label>Мосты <small>по одному в строке; нужны, если Tor заблокирован провайдером</small>
          <textarea id="bridges" rows="3" spellcheck="false" placeholder="obfs4 1.2.3.4:443 FINGERPRINT cert=… iat-mode=0"></textarea>
        </label>

        <h3>Прокси</h3>
        <label>Список <small>по одному в строке: socks5://host:port, http://user:pass@host:port</small>
          <textarea id="proxies" rows="5" spellcheck="false" placeholder="socks5://127.0.0.1:1080"></textarea>
        </label>
        <label>Автосмена IP каждые <input id="rotatemin" type="number" min="0" max="1440" step="1"> мин <small>0 — выключено</small></label>
      </section>

      <section>
        <h2>Защита</h2>
        <label class="check"><input id="spoof" type="checkbox"> Подменять отпечаток браузера</label>
        <label class="check"><input id="block" type="checkbox"> Блокировать трекеры и рекламные сети</label>
        <label class="check"><input id="checkip" type="checkbox"> Показывать внешний IP <small>один запрос к ipwho.is через текущий маршрут</small></label>
        <label>Часовой пояс
          <select id="tz">
            <option value="auto">Авто — по выходному IP</option>
            <option value="utc">Всегда UTC</option>
            <option value="system">Не менять</option>
          </select>
        </label>

        <h3>Текущая личность</h3>
        <dl id="persona"></dl>

        <div class="actions">
          <button id="apply" class="wide accent">Применить</button>
          <button id="closepanel" class="wide">Закрыть</button>
        </div>
        <p class="hint">Смена режима сети, прокси или защиты создаёт новую личность: вкладки закрываются, куки стираются.</p>
      </section>
    </div>
    <p class="credits">Brauser · Barathrum Co. · pulpadulpa</p>
  </main>

  <div id="toast" hidden></div>
  <script src="ui.js"></script>
</body>
</html>
